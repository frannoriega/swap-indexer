[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core/*",
    "crates/domains/*/interpreters/*",
    "crates/domains/*/model",
    "crates/domains/*/parsers/*",
    "crates/domains/trade/variants/*",
]

[workspace.dependencies]
anyhow = "1.0.104"
bs58 = "0.5.1"
clap = "4.6.7"
indexer = { path = "crates/core/indexer" }
parser-core = { path = "crates/core/parser-core" }
plain-trade-domain = { path = "crates/domains/trade/variants/plain" }
proptest = "1.12.0"
rpc-fetcher = { path = "crates/core/rpc-fetcher" }
solana-client = "4.3.0"
# Using older sdk version to align solana-client and solana-transaction-status
# to use the same solana-transaction-error dependency
# TODO: Update this once the other dependencies use solana-transaction-error ^4.1.0
solana-sdk = "4.1.0"
solana-transaction-status = "4.3.0"
test-strategy = "0.4.5"
trade-interpreter = { path = "crates/domains/trade/interpreters/trade" }
trade-model = { path = "crates/domains/trade/model" }
trade-parser-raydium = { path = "crates/domains/trade/parsers/raydium" }
trade-parser-spl-token = { path = "crates/domains/trade/parsers/spl-token" }
types = { path = "crates/core/types" }
utils = { path = "crates/core/utils" }

[workspace.lints.rust]
unused_imports = "warn"
unused_must_use = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
