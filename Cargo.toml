[workspace]
resolver = "2"
members = [
  "crates/types",
  "crates/parser-raydium",
  "crates/rpc-fetcher",
  "crates/parser-core",
  "crates/cli",
]

[workspace.dependencies]
anyhow = "1.0.104"
bs58 = "0.5.1"
clap = "4.6.7"
proptest = "1.12.0"
solana-client = "4.3.0"
# Using older sdk version to align solana-client and solana-transaction-status
# to use the same solana-transaction-error dependency
# TODO: Update this once the other dependencies use solana-transaction-error ^4.1.0
solana-sdk = "4.1.0"
solana-transaction-status = "4.3.0"
